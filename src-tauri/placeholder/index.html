<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Daily Digest</title>
    <style>
      :root {
        color-scheme: dark;
        background: #111215;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: #111215;
        color: #f5f5f7;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      main {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        letter-spacing: -0.01em;
        color: #a1a1a6;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
      }

      .mark span {
        width: 12px;
        height: 12px;
        border-radius: 4px;
        background: linear-gradient(135deg, #0a84ff, #64d2ff);
      }

      .pulse {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #0a84ff;
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"><span></span></div>
      <span>Starting The Daily Digest</span>
      <span class="pulse" aria-hidden="true"></span>
    </main>
  </body>
</html>
